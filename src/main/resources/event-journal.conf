pekko.persistence.journal.plugin = "pekko.persistence.r2dbc.journal"
pekko.persistence.journal.plugin = "pekko.persistence.r2dbc.batched-journal"

pekko.persistence.snapshot-store.plugin = "pekko.persistence.r2dbc.snapshot"
pekko.persistence.state.plugin = "pekko.persistence.r2dbc.state"

pekko.persistence.r2dbc {
  journal.plugin-dispatcher = "write-persistence-dispatcher"

  dialect = "yugabyte"

  connection-factory = ${pekko.persistence.r2dbc.connection-factory} {
    driver = "postgres"
    host = ${POSTGRES_HOST}
    port = ${POSTGRES_PORT}
    database = ${POSTGRES_DB}
    user = ${POSTGRES_USER}
    password = ${POSTGRES_PASSWORD}

    # Write-side (journal/snapshot) connection pool.
    initial-size = ${R2DBC_POOL_INITIAL_SIZE}
    max-size = ${R2DBC_POOL_MAX_SIZE}
  }

  # Set to 'on' if the DB guarantees timestamps never move backwards
  batched-journal.db-timestamp-monotonic-increasing = on
  batched-journal.use-app-timestamp = on
  batched-journal.batch {
    # lower latency, smaller batches. Include a unit, e.g. "2ms"
    window = ${EVENTS_BATCH_WRITE_WINDOW}

    # number of batches written concurrently; keep <= connection-factory max-size
    parallelism = ${EVENTS_BATCH_PARALLELISM}

    # max events coalesced per INSERT; keep modest, large values LOWER throughput (starves parallelism)
    max-requests = ${EVENTS_BATCH_MAX_REQUESTS}

    # overflow buffer size (this is what EVENTS_BATCH_QUEUE_SIZE was named for)
    queue-size = ${EVENTS_BATCH_QUEUE_SIZE}
  }
}

read-side-connection-factory = ${pekko.persistence.r2dbc.connection-factory} {
  driver = "postgres"
  host = ${POSTGRES_HOST}
  port = ${POSTGRES_PORT}
  database = ${POSTGRES_DB}
  user = ${POSTGRES_USER}
  password = ${POSTGRES_PASSWORD}

  max-size = ${READ_R2DBC_POOL_MAX_SIZE}
  initial-size = ${READ_R2DBC_POOL_INITIAL_SIZE}
}

# Dedicated pool for the wallet projection (read-model upserts + offset commits).
# Inherits the read-side connection params but is a SEPARATE factory, so projection
# grouped transactions (which hold a connection for the whole batch) cannot starve
# HTTP GET /wallet reads of connections, and vice-versa. Sized independently: one
# connection per projection instance plus headroom is plenty.
#
# Uses single required-substitution keys, mirroring read-side-connection-factory
# above. Do NOT use the "default value then ${?ENV} override" form here: duplicate
# keys inside an object-concatenation ( ${x} { k = 1; k = ${?ENV} } ) trip a Typesafe
# Config resolver bug (ConfigException$BugOrBroken: replaceChild did not find) that
# only surfaces at startup. Set PROJECTION_R2DBC_POOL_* in the environment (see
# TestEnv for the test-scope defaults).
projection-connection-factory = ${read-side-connection-factory} {
  initial-size = ${PROJECTION_R2DBC_POOL_INITIAL_SIZE}
  max-size = ${PROJECTION_R2DBC_POOL_MAX_SIZE}
}

# Run the wallet projection (read-model upserts + offset commits) on its OWN pool,
# isolated from BOTH the journal write pool and the HTTP read pool. By default
# pekko-projection-r2dbc shares the write connection-factory; sharing the read pool
# instead caused GET /wallet reads to starve for connections under load. A dedicated
# factory keeps journal writes, HTTP reads, and projection writes on three separate pools.
pekko.projection.r2dbc.use-connection-factory = "projection-connection-factory"
